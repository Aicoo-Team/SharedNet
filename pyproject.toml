[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sharednet"
version = "0.1.0"
description = "SharedNet coordination backends"
requires-python = ">=3.11"
license-files = ["THIRD_PARTY_NOTICES.md", "LICENSES/RAC-MIT.txt"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
sharednet = "sharednet.cli:main"

[project.optional-dependencies]
test = ["setuptools>=77.0.0", "httpx>=0.27,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
